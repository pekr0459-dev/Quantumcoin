<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Quantumcoin (QTM)</title>
  <circle cx="50" cy="50" r="48" fill="#0B1026"/>
  <circle cx="50" cy="50" r="44.5" fill="none" stroke="#22D3EE" stroke-opacity="0.35" stroke-width="1"/>
  <!-- back half of the orbit (goes under the O on the left) -->
  <path d="M -35 0 A 35 11 0 0 1 35 0" transform="translate(50 50) rotate(-30)" fill="none" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round"/>
  <!-- the O -->
  <circle cx="50" cy="48" r="21" fill="none" stroke="#F5F7FF" stroke-width="7"/>
  <!-- front half of the orbit (goes over the O at the lower left) -->
  <g transform="translate(50 50) rotate(-30)" fill="none">
    <path d="M -35 0 A 35 11 0 0 0 35 0" stroke="#0B1026" stroke-width="5.5"/>
    <path d="M -35 0 A 35 11 0 0 0 35 0" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- right side: the O passes over the front half of the orbit -->
  <path d="M 69.03 39.13 A 21 21 0 0 1 69.03 56.87" fill="none" stroke="#0B1026" stroke-width="11"/>
  <path d="M 68.71 38.47 A 21 21 0 0 1 68.71 57.53" fill="none" stroke="#F5F7FF" stroke-width="7"/>
  <!-- upper right: the back half of the orbit passes over the O -->
  <g transform="translate(50 50) rotate(-30)" fill="none">
    <path d="M 10.82 -10.46 A 35 11 0 0 1 28.32 -6.47" stroke="#0B1026" stroke-width="5.5"/>
    <path d="M 9.06 -10.63 A 35 11 0 0 1 29.35 -5.99" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- the Q tail, on top -->
  <line x1="59" y1="58" x2="69" y2="68.6" stroke="#F5F7FF" stroke-width="7" stroke-linecap="round"/>
  <circle cx="20.5" cy="62.7" r="3.6" fill="#A78BFA"/>
</svg>
